name: routex-stack

x-runtime: &runtime
  restart: unless-stopped
  init: true
  stop_grace_period: 45s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  security_opt: ["no-new-privileges:true"]

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-routex}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/${POSTGRES_DB:-routex_db}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  KAFKA_TRAFFIC_TOPIC: ${KAFKA_TRAFFIC_TOPIC:-routex-traffic-events}
  KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-routex-postgres-consumer}
  TOMTOM_API_KEY: ${TOMTOM_API_KEY:-}
  OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

services:
  db:
    <<: *runtime
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-routex_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  redis:
    <<: *runtime
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  kafka-volume-init:
    image: apache/kafka:4.0.0
    user: "0:0"
    entrypoint: [/bin/sh, -c]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    network_mode: none
    restart: "no"

  kafka:
    <<: *runtime
    image: apache/kafka:4.0.0
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 1g

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, "kafka:19092", --create, --if-not-exists, --topic, "${KAFKA_TRAFFIC_TOPIC:-routex-traffic-events}", --partitions, "1", --replication-factor, "1"]
    restart: "no"

  initialize:
    image: routex-backend:local
    build: {context: ., dockerfile: backend/Dockerfile, target: runtime}
    environment: *app-environment
    command: [python, -m, deploy.initialize]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  backend:
    <<: *runtime
    image: routex-backend:local
    build: {context: ., dockerfile: backend/Dockerfile, target: runtime}
    environment: *app-environment
    ports: ["127.0.0.1:${BACKEND_PORT:-8001}:8001"]
    volumes: [uploads:/app/data/uploads]
    depends_on:
      initialize: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    mem_limit: 3g

  consumer:
    <<: *runtime
    image: routex-backend:local
    environment: *app-environment
    command: [python, -m, vision.streaming.kafka_consumer]
    depends_on:
      initialize: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      disable: true
    mem_limit: 512m

  frontend:
    <<: *runtime
    image: routex-frontend:local
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 128m

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  uploads:
