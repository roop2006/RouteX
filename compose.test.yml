# Use only with an isolated project/database, never production records.
services:
  tests:
    image: routex-tests:local
    build: {context: ., dockerfile: backend/Dockerfile, target: test}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-routex}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-routex_db}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TOMTOM_API_KEY: ci-fixture-provider-key
      ROUTEX_TEST_OFFLINE: "1"
    depends_on:
      initialize: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
